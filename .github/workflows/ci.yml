name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Non-blocking for now: the repo carries ~1,385 pre-existing
      # prettier/prettier violations and ~184 no-explicit-any. Reformatting
      # the whole tree in one commit would collide with parallel work, so
      # lint reports but does not gate. Flip continue-on-error off once the
      # backlog is cleared.
      - name: Lint (reporting only)
        run: bun run lint
        continue-on-error: true

      - name: Tests
        run: bun run test

      - name: Coverage (enforces the ratchet in vitest.config.ts)
        run: bun run test:coverage

